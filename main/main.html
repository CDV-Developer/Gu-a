  <body data-game="gi">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-logos" role="tablist" aria-label="Juego">
            <button
              id="btnGI"
              class="brand-logo active"
              role="tab"
              aria-selected="true"
              data-game="gi"
              title="Genshin"
            >
              <img src="../img/logo.png" alt="Genshin" />
            </button>
            <button
              id="btnZZZ"
              class="brand-logo"
              role="tab"
              aria-selected="false"
              data-game="zzz"
              title="Zenless Zone Zero"
            >
              <img
                src="../img/logozzz.png"
                onerror="this.style.display='none'"
                alt="ZZZ"
              />
            </button>
          </div>
          <div class="brand-text">
            <div class="app-title">Visualizador de Builds</div>
            <div class="app-sub">
              <span id="gameLabel">Genshin Impact</span> — Guías de personajes
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="container">
      <aside class="sidebar" id="sidebar">
        <div class="controls">
          <div class="combo" id="combo">
            <input
              id="comboInput"
              class="combo-input"
              placeholder="Buscar personaje..."
              autocomplete="off"
            />
            <button
              id="clearSearch"
              class="combo-clear"
              type="button"
              aria-label="Borrar búsqueda"
              title="Borrar búsqueda"
              style="display: none"
            >
              ✕
            </button>
            <ul id="comboList" class="combo-list" role="listbox"></ul>
          </div>

          <div id="filtersWrapper" class="filters-wrapper filters-collapsed">
            <button
              id="filtersToggle"
              class="filters-toggle"
              aria-expanded="false"
              aria-controls="filterPanel"
              type="button"
            >
              Filtros ▸
            </button>

            <div class="filters" id="filterPanel"></div>

            <div class="cards-wrap" id="cardsWrap"></div>
          </div>
        </div>
      </aside>

      <main class="main">
        <div class="preview-header">
          <h2 id="currentTitle">Selecciona un personaje</h2>
          <div id="meta" class="meta">—</div>
          <div id="buildButtons" class="build-buttons" aria-hidden="true"></div>
        </div>
        <div class="preview">
          <iframe
            id="preview"
            sandbox="allow-same-origin allow-scripts allow-forms"
            src=""
            title="Previsualización"
          ></iframe>
          <div id="empty" class="empty">
            Aquí aparecerá la build seleccionada
          </div>
        </div>
      </main>
    </div>
